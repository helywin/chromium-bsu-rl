name: CI

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} / package and docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Create standalone development environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]'
      - name: Check documentation, types and Python-only tests
        run: |
          .venv/bin/python scripts/check_repository.py
          .venv/bin/python -m mypy
          .venv/bin/python -m unittest discover -s tests -p test_state.py -v
          .venv/bin/python -m unittest discover -s tests -p test_client.py -v
          bash -n scripts/build_chromium_rl.sh scripts/run_gui.sh
      - name: Build and verify distributions
        run: |
          .venv/bin/python -m build --no-isolation
          .venv/bin/python -m twine check dist/*
          .venv/bin/python scripts/check_distribution.py

  native:
    name: Native Linux / headless, display and source package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build isolated native development image
        run: docker build -t chromium-bsu-rl:ci .
      - name: Native headless tests (no display server, no network)
        run: |
          docker run --rm --init --network none chromium-bsu-rl:ci
          docker run --rm --init --network none chromium-bsu-rl:ci .venv/bin/python -m unittest discover -s tests -v
      - name: SDL and OpenGL tests (Xvfb display, software rendering)
        run: |
          docker run --rm --init --network none -e RUN_CHROMIUM_GUI_TESTS=1 -e LIBGL_ALWAYS_SOFTWARE=1 \
            chromium-bsu-rl:ci xvfb-run -a .venv/bin/python -m unittest discover -s tests -v
      - name: Build extracted source distribution and use installed wheel
        run: |
          docker run --rm --init --network none chromium-bsu-rl:ci bash -c '
            set -e
            .venv/bin/python -m build --no-isolation
            .venv/bin/python -m twine check dist/*
            .venv/bin/python scripts/check_distribution.py --native
          '
